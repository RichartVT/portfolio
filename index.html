<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e0f13" />
    <meta
      name="description"
      content="Software Developer and Computer Systems Engineering student focused on full-stack development and data, seeking a professional residency or internship."
    />
    <title>Richart Vázquez de la Torre — Software Developer</title>
    <link rel="canonical" href="https://www.richart.dev/" />

    <!-- Link previews (WhatsApp, LinkedIn, Slack, X). Crawlers do not run
         JavaScript, so these stay static and absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.richart.dev/" />
    <meta property="og:site_name" content="Richart Vázquez de la Torre" />
    <meta property="og:title" content="Richart Vázquez de la Torre — Software Developer" />
    <meta
      property="og:description"
      content="Full-stack development and data. Portfolio, projects and contact."
    />
    <meta property="og:image" content="https://www.richart.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Richart Vázquez de la Torre — Software Developer portfolio" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_MX" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Structured data: lets search engines show a proper profile card. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Richart Vázquez de la Torre",
        "jobTitle": "Software Developer",
        "url": "https://www.richart.dev/",
        "image": "https://www.richart.dev/og-image.png",
        "email": "mailto:richartvdt@gmail.com",
        "address": { "@type": "PostalAddress", "addressCountry": "MX" },
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "Instituto Tecnológico de Celaya"
        },
        "knowsAbout": [
          "Full-stack development",
          "React",
          "TypeScript",
          "Node.js",
          "Python",
          "Java",
          "SQL",
          "MongoDB",
          "AWS"
        ],
        "sameAs": ["https://github.com/RichartVT"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
